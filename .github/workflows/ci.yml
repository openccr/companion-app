name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  FLUTTER_VERSION: "3.35.5"

jobs:
  # ── Lint + Test (single container pull, single pub get) ──────────────────────
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:flutter-3.35.5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-linux-
      - run: flutter pub get
      - name: Format check
        run: dart format --set-exit-if-changed lib/ test/
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  # ── Platform builds (run after lint+test) ────────────────────────────────────
  linux:
    name: Linux build
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:flutter-3.35.5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-linux-
      - run: flutter pub get
      - run: flutter build linux --debug

  macos:
    name: macOS build
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-macos-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-macos-
      - run: flutter pub get
      - run: flutter build macos --debug

  windows:
    name: Windows build
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: pub-windows-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-windows-
      - run: flutter pub get
      - run: flutter build windows --debug

  # ── Derived builds (triggered by platform success) ───────────────────────────
  android:
    name: Android build
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:flutter-3.35.5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-linux-
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.gradle
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-
      - run: flutter pub get
      - name: Build APK (debug)
        run: flutter build apk --debug
      - name: Build App Bundle (debug)
        run: flutter build appbundle --debug

  ios:
    name: iOS build
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-macos-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-macos-
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
